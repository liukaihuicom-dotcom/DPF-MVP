operations:
  deposit:
    initial: draft
    terminal: [completed, rejected, expired, failed, cancelled]
    states:
      draft: User is preparing an IDR deposit request.
      submitted: Request accepted with idempotency and initial validation.
      awaiting_payment: Customer must complete payment through selected channel.
      payment_confirmed: Provider or operations confirms IDR payment.
      fx_locked: IDR/USD quote is locked for settlement.
      crediting: USD credit is being applied to the target trading account.
      reviewing: Manual review is required.
      completed: USD ledger credit completed.
      rejected: Request rejected by rule or reviewer.
      expired: Payment window or FX quote expired.
      failed: Provider, ledger, or system failure occurred.
      cancelled: User or system cancelled before irreversible processing.
    transitions:
      - [draft, submitted, submit_request]
      - [submitted, awaiting_payment, validation_passed]
      - [awaiting_payment, payment_confirmed, provider_payment_confirmed]
      - [payment_confirmed, reviewing, review_required]
      - [payment_confirmed, fx_locked, auto_review_passed]
      - [reviewing, fx_locked, reviewer_approved]
      - [reviewing, rejected, reviewer_rejected]
      - [fx_locked, crediting, lock_quote]
      - [crediting, completed, ledger_credit_success]
      - [awaiting_payment, expired, payment_window_expired]
      - [submitted, rejected, validation_failed]
      - [awaiting_payment, failed, provider_failed]
      - [crediting, failed, ledger_failed]
      - [draft, cancelled, user_cancelled]
  withdrawal:
    initial: draft
    terminal: [completed, rejected, failed, cancelled]
    states:
      draft: User is preparing an IDR payout request from a USD trading account.
      submitted: Request accepted with idempotency and initial validation.
      validating: KYC, account, balance, payout ownership, limit, fee, and FX checks run.
      reviewing: Manual review is required.
      processing: Payout provider or operations is processing.
      paid: Provider marks payout as paid.
      completed: USD debit and IDR payout are reconciled.
      rejected: Request rejected by rule or reviewer.
      failed: Provider, ledger, or system failure occurred.
      cancelled: User or system cancelled before irreversible processing.
    transitions:
      - [draft, submitted, submit_request]
      - [submitted, validating, request_received]
      - [validating, reviewing, review_required]
      - [validating, processing, auto_review_passed]
      - [reviewing, processing, reviewer_approved]
      - [reviewing, rejected, reviewer_rejected]
      - [processing, paid, provider_paid]
      - [paid, completed, ledger_reconciled]
      - [validating, rejected, validation_failed]
      - [processing, failed, provider_failed]
      - [paid, failed, reconciliation_failed]
      - [draft, cancelled, user_cancelled]
  internal_transfer:
    initial: draft
    terminal: [completed, rejected, failed, cancelled]
    states:
      draft: User is preparing same-owner account transfer.
      submitted: Request accepted with idempotency and initial validation.
      validating: KYC, ownership, source, target, balance, and limit checks run.
      reviewing: Manual review is required.
      completed: Source debit and target credit completed.
      rejected: Request rejected by rule or reviewer.
      failed: Ledger or system failure occurred.
      cancelled: User or system cancelled before irreversible processing.
    transitions:
      - [draft, submitted, submit_request]
      - [submitted, validating, request_received]
      - [validating, reviewing, review_required]
      - [validating, completed, auto_review_passed_and_ledger_success]
      - [reviewing, completed, reviewer_approved_and_ledger_success]
      - [reviewing, rejected, reviewer_rejected]
      - [validating, rejected, validation_failed]
      - [validating, failed, ledger_failed]
      - [reviewing, failed, ledger_failed]
      - [draft, cancelled, user_cancelled]
audit_required:
  fields: [actor, actorRole, reason, previousStatus, nextStatus, timestamp, requestId]
  applies_to: every_transition
security_center:
  alert:
    initial: active
    terminal: [resolved]
    states:
      active: Alert is visible or eligible to become the highest-priority visible alert.
      dismissed: User acknowledged the alert; unresolved alert can reappear after the configured 24-hour window.
      snoozed: Alert is hidden until snoozeUntil.
      resolved: Underlying event is handled and alert is no longer eligible for display.
    transitions:
      - [active, dismissed, user_dismissed]
      - [active, snoozed, user_snoozed]
      - [dismissed, active, unresolved_24h_elapsed]
      - [snoozed, active, snooze_expired]
      - [active, resolved, underlying_risk_resolved]
      - [dismissed, resolved, underlying_risk_resolved]
      - [snoozed, resolved, underlying_risk_resolved]
  totp:
    initial: not_bound
    terminal: [disabled]
    states:
      not_bound: User has not bound TOTP.
      binding: User is viewing QR/manual key and submitting verification code.
      active: TOTP is enabled and required for high-risk security and funds operations.
      disable_pending: Disable request is in 24-hour GSL; TOTP remains valid.
      disabled: TOTP is disabled after GSL effective transition.
      locked: TOTP verification is temporarily locked after repeated invalid attempts.
    transitions:
      - [not_bound, binding, bind_start]
      - [binding, active, verify_success_and_recovery_codes_saved]
      - [binding, locked, five_invalid_attempts]
      - [locked, binding, lock_window_elapsed]
      - [active, disable_pending, disable_request_verified]
      - [disable_pending, active, disable_cancelled]
      - [disable_pending, disabled, gsl_effective]
      - [active, locked, five_invalid_attempts]
  gsl:
    initial: pending
    terminal: [cancelled, effective, failed, superseded, expired]
    states:
      pending: Change is cooling down and can be cancelled when canCancel is true.
      cancelled: User cancelled before effectiveAt and original setting remains active.
      effective: Backend scheduler applied the change.
      failed: Backend, risk, admin, or scheduler failure prevented the change.
      superseded: A controlled admin/risk intervention replaced this change.
      expired: Exceptional state where the change did not apply within allowed execution window.
    transitions:
      - [pending, cancelled, user_cancelled_after_verification]
      - [pending, effective, scheduler_applied_change]
      - [pending, failed, scheduler_or_policy_failed]
      - [pending, superseded, admin_or_risk_superseded]
      - [pending, expired, execution_window_expired_without_effect]
  device:
    initial: active
    terminal: [revoked, expired]
    states:
      active: Device has an active session/token.
      revoked: Session/token was destroyed by user, system, or admin action.
      expired: Session/token expired naturally.
      trusted: Device is trusted for low or selected medium-risk operations until trustExpireAt.
      high_risk: Device is flagged by risk event and cannot bypass verification.
    transitions:
      - [active, revoked, revoke_non_current_device]
      - [active, expired, session_expired]
      - [active, trusted, trust_device]
      - [trusted, active, trust_removed_or_expired]
      - [active, high_risk, suspicious_event_detected]
      - [trusted, high_risk, suspicious_event_detected]
      - [high_risk, revoked, revoke_device]
  remote_login_risk:
    initial: low
    terminal: [confirmed_user, confirmed_not_user, blocked]
    states:
      low: New city in same country without other high-risk signals.
      medium: Remote login requires TOTP or email OTP.
      high: Remote login plus new device or proxy requires TOTP and cannot use trusted-device waiver.
      critical: Remote login plus high-risk IP/ASN or repeated failures is blocked.
      confirmed_user: User confirmed the login as their own.
      confirmed_not_user: User denied the login; device is logged out and recovery actions are recommended.
      blocked: Login attempt is blocked.
    transitions:
      - [low, medium, city_or_country_risk_increased]
      - [medium, high, new_device_or_proxy_detected]
      - [high, critical, high_risk_ip_or_repeated_failures]
      - [medium, confirmed_user, user_confirmed]
      - [high, confirmed_user, user_confirmed_after_totp]
      - [medium, confirmed_not_user, user_denied]
      - [high, confirmed_not_user, user_denied]
      - [critical, blocked, system_blocked]
security_audit_required:
  fields: [auditId, userId, actorType, actorId, actionType, targetType, targetId, ip, deviceId, userAgent, country, city, riskLevel, result, createdAt, requestId]
  applies_to: [login, password_change, email_change, phone_change, totp_bind, totp_disable, recovery_code_use, withdrawal_address_change, withdrawal_verification, device_revoke, revoke_other_devices, anti_phishing_code_change, admin_security_view]
